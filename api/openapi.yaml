components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Unique project identifier
      schema:
        type: string
        example: "abc123"

    ReviewId:
      name: review_id
      in: path
      required: true
      description: Review identifier (or 'latest' for most recent)
      schema:
        type: string
        example: "rev_abc123"

    BenchmarkId:
      name: benchmark_id
      in: path
      required: true
      description: Unique benchmark identifier
      schema:
        type: string
        example: "bench_a1b2c3d4"

  schemas:
    CreateProjectRequest:
      type: object
      required:
        - name
        - files
      properties:
        name:
          type: string
          description: Project name
          example: "Payment System Design"
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Project description (optional)
          example: "Design review for new payment processing system"
          maxLength: 1000
        context_id:
          type: string
          description: Organizational context document ID (optional). Links the project to a context for tailored reviews.
          example: "ctx_abc123"
        files:
          type: array
          description: List of files to upload. At least one file is required.
          minItems: 1
          items:
            type: object
            required:
              - filename
            properties:
              filename:
                type: string
                description: Original filename
                example: "payment-system-design.pdf"

    CreateProjectResponse:
      type: object
      properties:
        project_id:
          type: string
          description: Unique project identifier
          example: "abc123"
        name:
          type: string
          example: "Payment System Design"
        status:
          type: string
          enum: [pending]
          example: "pending"
        upload_urls:
          type: array
          description: Pre-signed S3 URLs for file upload (valid for 15 minutes)
          items:
            type: object
            properties:
              filename:
                type: string
              upload_url:
                type: string
                format: uri
        upload_expires_at:
          type: string
          format: date-time
          description: Upload URL expiration time
          example: "2024-03-05T10:15:00Z"
        created_at:
          type: string
          format: date-time
          example: "2024-03-05T10:00:00Z"

    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        count:
          type: integer
          description: Number of projects returned
          example: 10

    ProjectSummary:
      type: object
      properties:
        project_id:
          type: string
          example: "abc123"
        name:
          type: string
          example: "Payment System Design"
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
          example: "completed"
        created_at:
          type: string
          format: date-time
          example: "2024-03-05T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-03-05T10:30:00Z"

    ProjectResponse:
      type: object
      properties:
        project_id:
          type: string
          example: "abc123"
        name:
          type: string
          example: "Payment System Design"
        description:
          type: string
          example: "Design review for new payment processing system"
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
          example: "completed"
        document:
          type: object
          properties:
            s3_bucket:
              type: string
              example: "risk-assessor-design-docs-dev-123456789012"
            s3_key:
              type: string
              example: "projects/abc123/document.pdf"
            name:
              type: string
              example: "payment-system-design.pdf"
            size:
              type: integer
              description: File size in bytes
              example: 1048576
        review:
          $ref: '#/components/schemas/ReviewResult'
        created_at:
          type: string
          format: date-time
          example: "2024-03-05T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-03-05T10:30:00Z"

    ReviewResponse:
      type: object
      properties:
        review_id:
          type: string
          format: uuid
          example: "rev_xyz789"
        project_id:
          type: string
          example: "abc123"
        status:
          type: string
          enum: [completed, failed]
          example: "completed"
        result:
          $ref: '#/components/schemas/ReviewResult'
        created_at:
          type: string
          format: date-time
          example: "2024-03-05T10:15:00Z"
        duration_ms:
          type: integer
          description: Review duration in milliseconds
          example: 45000

    ReviewResult:
      type: object
      description: |
        Review results from all participating agents. The set of agents is
        dynamic — determined by the review plan, not a fixed list. Each
        agent produces findings with common fields (id, severity, title,
        description, recommendation, references) plus agent-specific
        enrichment fields defined by that agent's finding_schema in the
        registry.
      properties:
        summary:
          type: object
          properties:
            total_findings:
              type: integer
              example: 32
            critical_severity:
              type: integer
              example: 3
            high_severity:
              type: integer
              example: 8
            medium_severity:
              type: integer
              example: 15
            low_severity:
              type: integer
              example: 6
            by_agent:
              type: object
              description: Finding count per agent type
              additionalProperties:
                type: integer
              example:
                architecture: 10
                security: 12
                risk: 10
        reviews:
          type: object
          description: |
            Agent results keyed by agent_type. Keys are dynamic — any
            enabled review agent can appear (e.g. architecture, security,
            risk, cri_review, eu_regulatory).
          additionalProperties:
            type: object
            properties:
              findings:
                type: array
                items:
                  $ref: '#/components/schemas/Finding'
              summary:
                type: string
                description: Agent's narrative summary
              status:
                type: string
                enum: [completed, failed, timeout]
              status_reason:
                type: string
        plan:
          $ref: '#/components/schemas/ReviewPlan'
        metrics:
          type: object
          description: Token usage and timing metrics
          properties:
            total_tokens:
              type: integer
            input_tokens:
              type: integer
            output_tokens:
              type: integer

    Finding:
      type: object
      description: |
        A single review finding. All findings share the common fields below.
        Agent-specific enrichment fields (e.g. owasp_category for security,
        quality_attribute for architecture, likelihood/consequence for risk)
        are defined by each agent's finding_schema in the registry and appear
        as additional properties.
      required:
        - id
        - severity
        - title
        - description
        - recommendation
      properties:
        id:
          type: string
          description: Unique finding identifier
          example: "SEC-001"
        severity:
          type: string
          enum: [critical, high, medium, low]
          example: "high"
        title:
          type: string
          description: Brief finding title
          example: "Credit Card Data Stored Unencrypted"
        description:
          type: string
          description: Detailed finding description (markdown)
          example: "Credit card data is stored in the database without encryption, violating PCI DSS requirements."
        recommendation:
          type: string
          description: Specific, actionable recommendation (markdown)
          example: "Use a PCI DSS compliant payment processor like Stripe. Never store raw credit card data."
        references:
          type: array
          items:
            type: string
          description: References to document sections
          example: ["Section 4.3 Data Protection", "PCI DSS Requirement 3.4"]
      additionalProperties: true

    ReviewPlan:
      type: object
      properties:
        plan_id:
          type: string
          example: "plan_a1b2c3"
        document_type:
          type: string
          example: "microservices_architecture"
        complexity:
          type: string
          enum: [low, medium, high]
          example: "high"
        rationale:
          type: string
          example: "Distributed event-driven system requiring thorough review"
        status:
          type: string
          enum: [pending_approval, approved, rejected, expired]
          example: "pending_approval"
        groups:
          type: array
          items:
            type: object
            properties:
              group_id:
                type: string
              label:
                type: string
              execution:
                type: string
                enum: [parallel, sequential]
              agents:
                type: array
                items:
                  type: object
                  properties:
                    agent_type:
                      type: string
                      enum: [architecture, security, risk]
                    depth:
                      type: string
                      enum: [quick, standard, thorough]
                    focus_areas:
                      type: array
                      items:
                        type: string
                    prompt_addendum:
                      type: string

    CreateBenchmarkRequest:
      type: object
      required:
        - name
        - document_project_id
        - agent_type
        - configurations
      properties:
        name:
          type: string
          description: Human-readable benchmark name
          example: "Sonnet 4 vs Haiku — Architecture"
        document_project_id:
          type: string
          description: Source project ID for the document to benchmark against
          example: "proj_abc"
        agent_type:
          type: string
          description: Agent type to benchmark
          example: "architecture"
        configurations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BenchmarkConfiguration'

    BenchmarkConfiguration:
      type: object
      required:
        - model_id
        - label
      properties:
        config_id:
          type: string
          description: Unique config identifier (auto-generated if omitted)
        label:
          type: string
          description: Human-readable label
          example: "Sonnet 4 (standard depth)"
        model_id:
          type: string
          description: Bedrock model ID
          example: "us.anthropic.claude-sonnet-4-20250514-v1:0"
        depth:
          type: string
          enum: [quick, standard, thorough]
          default: standard
        prompt_version:
          type: string
          default: "v1"

    BenchmarkResponse:
      type: object
      properties:
        benchmark_id:
          type: string
        name:
          type: string
        document_project_id:
          type: string
        agent_type:
          type: string
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkConfiguration'
        status:
          type: string
          enum: [pending, running, completed, partial, failed]
        created_at:
          type: string
          format: date-time

    BenchmarkSummary:
      type: object
      properties:
        benchmark_id:
          type: string
        name:
          type: string
        document_project_id:
          type: string
        agent_type:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    BenchmarkDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BenchmarkResponse'
        - type: object
          properties:
            runs:
              type: array
              items:
                $ref: '#/components/schemas/BenchmarkRunResult'

    BenchmarkRunResult:
      type: object
      properties:
        config_id:
          type: string
        status:
          type: string
          enum: [completed, failed]
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        summary:
          type: string
        quality_scores:
          type: object
          properties:
            completeness:
              type: number
            specificity:
              type: number
            actionability:
              type: number
            overall:
              type: number
        metrics:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            total_tokens:
              type: integer
            total_duration_s:
              type: number
            judge_input_tokens:
              type: integer
            judge_output_tokens:
              type: integer
        completed_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request"
        details:
          type: string
          description: Additional error details
          example: "Missing required field: name"

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_field:
              summary: Missing required field
              value:
                error: "Missing required field: name"
            invalid_agent:
              summary: Invalid agent name
              value:
                error: "Invalid agent. Must be one of: architecture, security, risk"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            project_not_found:
              summary: Project not found
              value:
                error: "Project not found: abc123"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            server_error:
              summary: Server error
              value:
                error: "Internal server error"
                details: "Failed to invoke agent"

  securitySchemes:
    CognitoAuth:
      type: oauth2
      description: Cognito User Pool JWT authentication
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: "$request.header.Authorization"
        jwtConfiguration:
          audience:
            - "${cognito_client_id}"
          issuer: "${cognito_issuer_url}"

security:
  - CognitoAuth: []
