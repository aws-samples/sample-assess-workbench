  /contexts:
    post:
      tags:
        - contexts
      summary: Create a new context document
      description: |
        Creates a new organizational context document and returns a pre-signed S3 URL for upload.
        Context documents describe business environment, regulatory requirements, and technology
        standards. They are applied to project reviews so agents produce contextually relevant findings.
      operationId: createContext
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: ${lambda_invoke_arn}
        payloadFormatVersion: "2.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Context document name
                  example: "ACME Corp - Financial Services"
                description:
                  type: string
                  description: Brief description
                  example: "PCI DSS compliant fintech environment"
      responses:
        '201':
          description: Context created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  context_id:
                    type: string
                  name:
                    type: string
                  upload_url:
                    type: string
                    format: uri
                  upload_expires_at:
                    type: string
                    format: date-time
