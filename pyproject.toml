[project]
name = "risk-assessor"
version = "0.1.0"
description = "Multi-agent AI system for reviewing solution design documents"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.33.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.8",
    "vulture>=2.16",
    "radon>=6.0.1",
    "pyyaml>=6.0.3",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: pure logic tests — no AWS, no mocks of AWS",
    "live: tests against real deployed AWS infrastructure",
    "integration: (legacy) alias for live tests",
]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
